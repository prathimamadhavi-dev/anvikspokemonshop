<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeShop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PokeShop</h1>
    <input type="text" id="searchBar" placeholder="Search cards..." />
  </header>

  <section class="cards-container" id="cardsContainer">
    <div class="card">
      <img src="https://images.pokemontcg.io/sv3pt5/188_hires.png" alt="Alakazam EX" />
      <h2>Alakazam EX Full Art</h2>
      <p>151 #188/165</p>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/swsh7/74_hires.png" alt="Sylveon V" />
      <h2>Sylveon V</h2>
      <p>Evolving Skies</p>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/swsh12pt5gg/GG44_hires.png" alt="Lugia" />
      <h2>Lugia</h2>
      <p>Crown Zenith</p>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/swsh10/48_hires.png" alt="Lycanroc" />
      <h2>Lycanroc</h2>
      <p>Astral Radiance</p>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/base1/25_hires.png" alt="Zapdos" />
      <h2>Zapdos</h2>
      <p>Base Set</p>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/jungle/9_hires.png" alt="Pinsir" />
      <h2>Pinsir</h2>
      <p>Jungle Set</p>
    </div>
  </section>

  <section class="meeting-section">
    <h2>Schedule a Meeting</h2>
    <form id="meetingForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="date" id="date" required />
      <textarea id="message" placeholder="Message" required></textarea>
      <button type="submit">Schedule</button>
    </form>

    <div id="submissionsPanel">
      <h3>Meeting Submissions</h3>
      <ul id="submissionsList"></ul>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
