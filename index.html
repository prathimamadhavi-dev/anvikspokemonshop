<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokemon Trading</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
</head>
<body>

<div class="container">
  <h1 class="glow-text">Pokemon Card Trading</h1>

  <!-- Cards -->
  <div class="cards">

    <div class="card">
      <img src="https://images.pokemontcg.io/swsh12/138.png">
      <h3>Lugia V</h3>
      <button onclick="openForm('Lugia V')">Request</button>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/sv2/188.png">
      <h3>Alakazam EX</h3>
      <button onclick="openForm('Alakazam EX')">Request</button>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/sv3/145.png">
      <h3>Zapdos ex</h3>
      <button onclick="openForm('Zapdos ex')">Request</button>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/sv2/1.png">
      <h3>Pinsir ex</h3>
      <button onclick="openForm('Pinsir ex')">Request</button>
    </div>

    <div class="card">
      <img src="https://images.pokemontcg.io/swsh12/92.png">
      <h3>Lycanroc V</h3>
      <button onclick="openForm('Lycanroc V')">Request</button>
    </div>

  </div>

  <!-- Form -->
  <div class="card form-card" id="formBox" style="display:none;">
    <h2 class="glow-text">Request / Schedule</h2>

    <input id="name" placeholder="Your Name">
    <input id="email" placeholder="Gmail Only">
    <input type="datetime-local" id="time">

    <select id="type">
      <option value="Buy">Buy</option>
      <option value="Trade">Trade</option>
      <option value="Meeting">Meeting</option>
    </select>

    <button onclick="submitForm()">Submit</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
