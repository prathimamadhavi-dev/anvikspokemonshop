<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anvik's Pokémon Market</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Anvik's Pokémon Market</h1>
  <p class="sub">Collection Trading Hub</p>
</header>

<section>
<h2>My Collection</h2>

<div class="grid">

  <!-- ZAPDOS -->
  <div class="card" data-name="Zapdos ex 192/165">
    <img src="https://images.pokemontcg.io/sv3pt5/192_hires.png">
    <span>Zapdos ex</span>
  </div>

  <!-- MEDICHAM -->
  <div class="card" data-name="Medicham ex 054/102">
    <img src="https://images.pokemontcg.io/sv7/54_hires.png">
    <span>Medicham ex</span>
  </div>

  <!-- PINSIR -->
  <div class="card" data-name="Pinsir 168/167">
    <img src="https://images.pokemontcg.io/sv6/168_hires.png">
    <span>Pinsir</span>
  </div>

  <!-- LUGIA -->
  <div class="card" data-name="Lugia V SWSH301">
    <img src="https://images.pokemontcg.io/swshp/SWSH301_hires.png">
    <span>Lugia V</span>
  </div>

  <!-- ALAKAZAM -->
  <div class="card" data-name="Alakazam ex 188/165">
    <img src="https://images.pokemontcg.io/sv3pt5/188_hires.png">
    <span>Alakazam ex</span>
  </div>

  <!-- LYCANROC -->
  <div class="card" data-name="Lycanroc V 091/203">
    <img src="https://images.pokemontcg.io/swsh7/91_hires.png">
    <span>Lycanroc V</span>
  </div>

</div>
</section>

<!-- PANEL -->
<div id="panel" class="panel hidden">

<h2 id="selectedCard">Selected</h2>

<div class="btnRow">
  <button onclick="mode('trade')">Trade</button>
  <button onclick="mode('buy')">Buy</button>
</div>

<div id="formArea"></div>

<button class="closeBtn" onclick="closePanel()">Close</button>

</div>

<hr>

<section>
<h2>Command Panel</h2>

<input id="pass" type="password" placeholder="Access Code">
<button onclick="unlock()">Unlock</button>

<pre id="admin" class="hidden"></pre>

</section>

<script src="script.js"></script>
</body>
</html>
